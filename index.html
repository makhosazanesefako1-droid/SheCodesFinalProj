<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Azana App</title>
    <link rel="stylesheet" href="weather.css" />
  </head>
  <body>
    <header>
      <form>
        <input type="search" placeholder="Enter a city.." required name="city" />
        <input type="submit" value="Search" />
      </form>
    </header>

    <main class="weather-app">
      <div class="weather-info">
        <h1>Paris</h1>
        <p>
          Tuesday 14:49, scattered clouds
          <br />
          Humidity: 66%, Wind: 3.13km/h
        </p>
      </div>

      <div class="temperature">
        <span>🌤️</span>
        <strong>12°C</strong>
      </div>
    </main>

    <footer>
      This project was created by
      <a href="https://github.com/makhosazanesefako1-droid" target="_blank" rel="noopener noreferrer">
        Makhosazana Sefako
      </a>
       on GitHub
      <a href="https://github.com/makhosazanesefako1-droid/SheCodesFinalProj.git" target="_blank" rel="noopener noreferrer">
        GitHub
      </a>
      and hosted on
      <a href="https://meteo-shecodes-app.netlify.app/" target="_blank" rel="noopener noreferrer">
        Netlify
      </a>.
    </footer>

    <script src="weather.js"></script>
  </body>
</html>
